[package]
name = "cratonvm-gc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Garbage collector and memory management for CratonVM"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cratonvm-types = { path = "../types", version = "0.3.0" }
# Phase accounting (`docs/observability/phase-accounting.md` §10.2): the
# `Category::GcPause` / `Category::GcConcurrent` spans in `g1.rs`, `gen_heap.rs`
# and `concurrent_mark.rs` need `cratonvm_jfr::phase`. Acyclic by inspection:
# `cratonvm-jfr` depends on `cratonvm-types` and nothing else in the workspace
# (and has no `[dev-dependencies]` at all). The `cratonvm-jit` edge below is
# `[dev-dependencies]`-only and is unaffected.
cratonvm-jfr = { path = "../jfr", version = "0.3.0" }
parking_lot.workspace = true
tracing.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
cratonvm-jit = { path = "../jit", version = "0.3.0" }
# Property-based tests for GC reachability (see tests/proptest_graph.rs).
# Catches card-table race conditions and write-barrier completeness
# regressions more reliably than hand-rolled stress tests.
proptest = "1"

# loom is a permutation-testing tool for concurrent code. We use it under
# the `cfg(loom)` flag — guarded so production builds do not pay the cost
# of swapping std atomics for loom's instrumented atomics. Run with:
#   RUSTFLAGS="--cfg loom" cargo test --test loom_satb
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[features]
# `zgc` is DEFAULT-ON as of 2026-08-10, because `GcAlgorithm`'s default is now
# `Zgc` (`vm/src/config.rs`) and that variant is `#[cfg(feature = "zgc")]`. A
# `--no-default-features` build still compiles: the default falls back to
# `Generational` under the matching `cfg(not(...))`, and `-XX:+UseGenerationalGC`
# remains the always-available escape hatch in either build.
default = ["zgc"]
# GPU-offload coordination primitives (Part F of the GPU offload plan).
# Enables `safepoint::SafepointToken`, `Heap::enter_gpu_critical`, and
# GC-delay logic that pauses collection while a token is held. With this
# feature off the crate compiles to identical bytes as before the GPU work.
gpu-offload = []
# The Z Garbage Collector backend. As of 2026-08-10 this is `src/zgc.rs`,
# `src/zgc_concurrent.rs` and the TWELVE modules of `src/zgc/`: vaddr, page,
# barrier, forwarding, metrics, remembered, mark, generation, relocate, tlab,
# census, adapters. (`adapters` was the undeclared file this comment warned
# about on 2026-08-07; it is declared now, so the count moved 11 -> 12 — which
# is the whole reason the recount command below exists.)
# Whole-feature unit tests: ~380 and rising as of 2026-08-07 (91 `zgc.rs` + 12
# `zgc_concurrent.rs` + ~275 across the declared modules; it moved 368 -> 379
# during the afternoon this comment was written).
# Quote the MODULE COUNT, not the test total. Recount only what actually
# compiles — the `pub mod` block in `src/zgc.rs` is the authority:
#   grep -c '#\[test\]' gc/src/zgc.rs gc/src/zgc_concurrent.rs \
#     $(sed -n 's/^pub mod \(.*\);$/gc\/src\/zgc\/\1.rs/p' gc/src/zgc.rs)
# Do NOT glob `gc/src/zgc/*.rs`: UNDECLARED files land in that directory and a
# glob counts them as if they were live. On 2026-08-07 `adapters.rs` sat there
# undeclared — 11 tests that never ran, and a glob inflated the total by 11.
# `gc/tests/zgc_module_integration.rs` (25 tests) is a separate integration
# target and is in neither figure.
# THREE things of very different maturity sit behind this one flag, and
# conflating them has already produced a wrong comment here once:
#
#  * `ZgcRealHeap` is REAL, not a stub. It backs every allocation with owned
#    memory (an `Arena` per page tier), writes real `ObjectHeader`s, and
#    implements the `collector::GarbageCollector` trait with the same
#    bounds-checked field/array semantics as `gen_heap::GenerationalHeap` and
#    `g1::G1Collector`. `collect_garbage` is a genuine stop-the-world
#    mark-sweep: it traces the live graph from the supplied roots, marks
#    survivors in the header and reclaims dead objects onto a free list. It is
#    non-moving, so it reclaims but does not compact.
#  * The SIMULATION is gone (2026-09-02). `ZgcCollector` / `ZgcHeap` /
#    `GenerationalZgc` / `ColoredPointer` / `LoadBarrier` were a metadata-only
#    model of OpenJDK ZGC -- synthetic page addresses, a forwarding table that
#    copied no bytes, a `&mut self` load barrier -- kept as scaffolding for the
#    real modules. The real modules landed, so the scaffolding was 1,250 lines
#    of a production file that nothing outside its own tests referenced. Every
#    concept in it now has an honest implementation: `zgc::vaddr`,
#    `zgc::barrier`, `zgc::page`, `zgc::generation`.
#  * The twelve `src/zgc/` modules are real, compiling and unit-tested, and
#    most of them are adopted by `ZgcRealHeap` to some degree.
#    DO NOT WRITE THE NUMBERS HERE. A census in this comment and its twin in
#    `src/zgc.rs` were both wrong within days of being written, and the wrong
#    one was carried into
#    `docs/known-issues/tomcat/gc-backend-3way-fullsuite-comparison-20260810.md`
#    and used to discount a suite result. The count now lives in
#    `types/tests/zgc-submodule-adoption.txt`, is produced by
#    `scripts/zgc-submodule-adoption.sh`, and is enforced by
#    `zgc_submodule_adoption_matches_the_recorded_census` -- so it cannot go
#    stale silently. Read it there.
#    Remaining adoption is tracked in
#    `docs/feature-designs/zgc-production-implementation-plan.md`.
#
# IT HAS IN-TREE CONSUMERS. `vm_heap.rs` carries a `VmHeap::Zgc` arm behind
# `#[cfg(feature = "zgc")]`, and `cratonvm-vm` forwards the feature
# (`cratonvm-vm/zgc` -> `GcAlgorithm::Zgc`, `GcBackend::Zgc`, and the
# `parse_gc_algorithm` "z" | "zgc" arm) so `-XX:+UseZGC` really selects this
# collector.
#
# DEFAULT-OFF because it is not yet at pass-rate parity with `Generational`,
# NOT because nothing uses it. The first full Spring Boot suite comparison
# (2026-08-07, same binary, same 1975 classes) measured 1860 PASS / 49 HANG /
# 22 FAIL under `-XX:+UseZGC` against 1902 / 18 / 11 on the default collector
# — see `fixed-suite-bugs/springboot/zgc-real-fullsuite-regression-RETIRED-20260807.md`.
#
# DEFAULT-OFF IS NOT UNCOMPILED. A configuration nothing builds rots: this one
# stopped compiling entirely (E0063) when `ZgcRealHeap::with_capacity()` was
# not given the `layout_domain` field its three sibling collectors gained on
# 2026-08-05. ci.yml's `experimental-features` job now builds the
# `cratonvm-cli` BINARY under the feature and runs this crate's unit tests
# with it, so a break of that class fails CI instead of waiting for a suite
# run to notice.
zgc = []

[lints]
workspace = true
