[package]
name = "rustjvm-gc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Garbage collector and memory management for RustJVM"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rustjvm-types = { path = "../types" }
parking_lot = "0.12"
tracing.workspace = true
rustc-hash = "1.1"

[dev-dependencies]
rustjvm-jit = { path = "../jit" }

[features]
default = []
# GPU-offload coordination primitives (Part F of the GPU offload plan).
# Enables `safepoint::SafepointToken`, `Heap::enter_gpu_critical`, and
# GC-delay logic that pauses collection while a token is held. With this
# feature off the crate compiles to identical bytes as before the GPU work.
gpu-offload = []
# Round-7 cross-cutting Fix 4: the `zgc` module is a 1884-LOC stub of the
# Z Garbage Collector with no consumers in the workspace. Off-by-default
# saves compile time + binary size; flip on with `--features zgc` once a
# concrete in-tree user appears.
zgc = []

[lints]
workspace = true
