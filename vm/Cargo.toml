[package]
name = "cratonvm-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Java Virtual Machine implementation in Rust"
readme = "README.md"
# Compiled Java test fixtures (.class files and the resource/boot-fixture
# trees that hold them) are committed for the integration tests but must
# not ship in the published crate ??? they bloat `cargo package` with ~2.5 MB
# of opaque bytecode. Integration-test `.rs` sources live directly under
# tests/ and are unaffected.
exclude = [
    "tests/resources/**",
    "tests/wildfly_boot_fixtures/**",
    # Historical Criterion output is useful for local comparisons but is
    # generated data and must not be included in source packages.
    "target_bench/**",
    "**/*.class",
]

[features]
# NEW-11: `synthetic-jdk` is intentionally NOT in the default feature set.
# The default build boots against real JDK bytecode loaded from
# `$JAVA_HOME/lib/modules` (via the NEW-5 jimage reader) with the ~150
# essential natives as the Rust support surface. To run the legacy
# synthetic test suite or to debug against Rust-side stubs, pass
# `--features synthetic-jdk` explicitly. See `docs/roadmap.md` NEW-11
# for the rationale and the census-driven migration plan.
# Keep the shipping build surface to production-intended subsystems. What
# dropping a feature actually removes differs per feature:
#
#  * `experimental-aot` / `-serialization` gate module declarations in
#    `cratonvm-native-builtins`, so dropping them really stops compiling that
#    code. `experimental-debug` gates the JDWP surface the same way.
#  * `experimental-tls` is a no-op alias (NEW-13) kept only so downstream
#    feature requests and `check-cfg` keep resolving — the `javax.net.ssl`
#    implementation is always compiled and registered.
#  * `experimental-jmx` is NOT optional in practice and stays in the default
#    set. Its name says experiment; what it gates is the `sun.management`
#    native surface, and `java.lang.management.ManagementFactory` is core JDK
#    API that the JDK's own bootstrap reaches. Without it,
#    `ManagementFactory.getMemoryPoolMXBeans()` dies with
#    `UnsatisfiedLinkError: sun/management/VMManagementImpl.getVersion0()`
#    (`vm/tests/wave1_a_jmx_mxbeans.rs` catches exactly this). Renaming the
#    feature would be the honest fix; removing it from the default build is not.
#
# ZGC remains selectable with `--features zgc`. The `experimental-features` CI
# job builds and runs the whole optional surface, because this repository has
# already lost 1,522 tests to a configuration that nothing compiled.
default = ["awt", "experimental-jmx"]
# AWT/Swing/Java2D desktop natives. On by default so the standard build
# registers them exactly as before. `cratonvm-native-awt` sets
# `publish = false`, so this feature is what makes the dependency optional:
# `cargo publish -p cratonvm-vm --no-default-features` can drop it.
awt = ["dep:cratonvm-native-awt"]
synthetic-jdk = [
    "cratonvm-native-builtins/synthetic-jdk",
    "cratonvm-native-collections/synthetic-jdk",
    "cratonvm-native-io/synthetic-jdk",
    # The legacy synthetic surface includes JMX bootstrap classes and therefore
    # intentionally opts into that experimental native module.
    "experimental-jmx",
]
experimental-tls = ["cratonvm-native-builtins/experimental-tls"]
experimental-jmx = ["cratonvm-native-builtins/experimental-jmx"]
experimental-serialization = ["cratonvm-native-builtins/experimental-serialization"]
experimental-aot = ["cratonvm-native-builtins/experimental-aot"]
experimental-debug = []
# T19.H7 diagnostic logger. Off by default ??? these warn-level traces are
# bring-up scaffolding that fired on every class-load, opcode dispatch, and
# native call; building with this feature flag re-enables them only when an
# operator is explicitly debugging a Wave-7 hang. Sessions 93-94 had to
# revert two silent re-enables; gating behind a feature ensures it cannot
# leak back into the default build.
experimental-t19-diag = []
# GPU offload ??? Part C marshalling + (future Parts E/F) interpreter hook and
# safepoint coordination. Off by default. With this feature off, the VM crate
# compiles no GPU code paths and does not link `cuda-bridge` or `jit-cuda`.
gpu-offload = ["dep:cuda-bridge", "dep:jit-cuda", "cratonvm-gc/gpu-offload", "cratonvm-native-builtins/gpu-offload", "dep:bytemuck"]
# Selectable memory-backed ZGC-real backend (`-XX:+UseZGC`).
zgc = ["cratonvm-gc/zgc"]

[dependencies]
cratonvm-reader = { path = "../reader", version = "0.3.0" }
cratonvm-types = { path = "../types", version = "0.3.0" }
cratonvm-native-api = { path = "../native-api", version = "0.3.0" }
cratonvm-native-collections = { path = "../native-collections", version = "0.3.0" }
cratonvm-native-io = { path = "../native-io", version = "0.3.0" }
cratonvm-native-builtins = { path = "../native-builtins", version = "0.3.0" }
cratonvm-jit-api = { path = "../jit-api", version = "0.3.0" }
cratonvm-jit = { path = "../jit", version = "0.3.0" }
# Decode-only x86-64 disassembler for the CRATONVM_DBG_JIT_DISASM diagnostic
# (vm/src/jit/disasm.rs). Inert at runtime unless the env var is set.
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "nasm"] }
cratonvm-classloading = { path = "../classloading", version = "0.3.0" }
cratonvm-gc = { path = "../gc", version = "0.3.0" }
cratonvm-jfr = { path = "../jfr", version = "0.3.0" }
# PUBLISH-BLOCKER FIX: `cratonvm-native-awt` sets `publish = false`, and
# crates.io forbids publishing a crate with a non-optional, unpublished
# normal dependency. Making it optional behind the (default-on) `awt`
# feature keeps the default build/test behavior identical (AWT natives are
# still registered) while allowing `cargo publish` of `cratonvm-vm` with
# `--no-default-features` to exclude the unpublished crate.
cratonvm-native-awt = { path = "../native-awt", version = "0.3.0", optional = true }
# Optional, only pulled in by the `gpu-offload` feature. See the feature
# table above. With `gpu-offload` off, these crates are not linked.
cuda-bridge = { path = "../cuda-bridge", version = "0.3.0", optional = true, package = "cratonvm-cuda-bridge" }
jit-cuda = { path = "../jit-cuda", version = "0.3.0", optional = true, package = "cratonvm-jit-cuda" }
bytemuck = { version = "1.16", optional = true }
thiserror.workspace = true
tracing.workspace = true
indexmap = "2"
bitfield-struct = "0.9"
zip.workspace = true
parking_lot.workspace = true
regex = "1"
libloading = "0.8"
rustc-hash.workspace = true
smallvec.workspace = true
# NEW-20: bench-gate binary uses serde to read criterion estimates.json
# files and the committed vm/bench/baseline.json file.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
cratonvm-native-api = { path = "../native-api", features = ["test-mock"] }
tracing-subscriber.workspace = true
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "vm_benchmarks"
harness = false

# NEW-20: benchmark-gate CLI. Compares the criterion run output in
# target/criterion/ against the committed vm/bench/baseline.json and
# exits non-zero on regression > threshold.
[[bin]]
name = "bench-gate"
path = "src/bin/bench_gate.rs"

# T5.1.2: HotSpot C2 ratio comparator. Reads vm/bench/baseline.json and
# vm/bench/hotspot-baseline.json, prints a per-metric ratio table plus
# geomean, exits non-zero when the geomean exceeds the threshold (1.5??
# by default per T5.8.1).
[[bin]]
name = "bench-hotspot-compare"
path = "src/bin/bench_hotspot_compare.rs"

[lints]
workspace = true
