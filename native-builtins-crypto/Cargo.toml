[package]
name = "cratonvm-native-builtins-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Separately compiled cryptographic compatibility kernels for CratonVM"

[dependencies]
sha3 = "0.10"
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid", "compress"] }
sha2 = { version = "0.10", features = ["oid", "compress"] }
# SBR wave 5 (`jdk_intrinsics`): GHASH over the JDK's own GCM state, and
# Keccak-f[1600] for `SHA3.implCompress0`. Both already in the lock file
# (via `aes-gcm` and `sha3`).
ghash = "0.6"
keccak = "0.1"

[dev-dependencies]
cratonvm-native-api = { path = "../native-api" }
aes = "0.8"

[lints]
workspace = true
