# TODO(orchestrator): refresh and re-activate.
#
# Parked: this file defines `name: CI`, which would collide with the
# currently-active `.github/workflows/ci.yml` (also named "CI"). The active
# CI is a slimmer matrix (ubuntu+windows, build+clippy+test); this parked
# variant adds macOS, JDK 25 setup, `cargo doc`, coverage, audit, and miri
# jobs. Activating it requires either (a) merging the extra jobs into the
# active `ci.yml`, or (b) renaming this workflow and pruning the duplicated
# build+test jobs to avoid double-running on every PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # IMPORTANT: setting RUSTFLAGS here REPLACES (does not merge with) any
  # `rustflags = [...]` from `.cargo/config.toml`. The config file enables
  # `+sse4.2,+pclmulqdq` for x86_64; if we ship without those features the CI
  # binary diverges from the released binary. Include the config-toml flags
  # explicitly so the CI matches what users actually run.
  RUSTFLAGS: "-C target-feature=+sse4.2,+pclmulqdq -Dwarnings"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Check formatting
        run: cargo fmt --all -- --check

      # RJ.1: enforce that no DIAG/TRACE/SB-TRACE eprintln/println
      # markers slip back into landed code. Structured diagnostics
      # belong in `tracing::*`; these raw prints pollute stderr and
      # race with the tracing subscriber.
      - name: Forbid debug-trace prints
        if: matrix.os != 'windows-latest'
        run: bash scripts/check-no-diag-prints.sh

      - name: Build
        run: cargo build --all-targets

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all

      - name: Build documentation
        run: cargo doc --all --no-deps
        if: matrix.os == 'ubuntu-latest'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all --lcov --output-path lcov.info

      - name: Coverage summary
        run: cargo llvm-cov --all --fail-under-lines 65

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run audit
        run: cargo audit

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly + Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2

      - name: Run Miri
        run: cargo miri test --all
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
