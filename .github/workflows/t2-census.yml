name: T2 Missing-Natives Census

# T2.1.1: dedicated CI job that runs the workspace test suite with the
# NEW-11 default feature set (which already EXCLUDES `synthetic-jdk`).
# This is the "no-default-natives" gate required by roadmap-100.md
# step T2.1.1 — any test that needs a native CratonVM hasn't provided
# yet will surface here rather than in downstream tiers.
#
# The job also uploads `bench/missing-natives.json` as a CI artifact so
# the census can be diffed against the committed baseline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=+sse4.2,+pclmulqdq -Dwarnings"

jobs:
  no-default-natives:
    name: T2 — no-default-natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      # synthetic-jdk is deliberately absent, which is what makes this the
      # T2.1.1 command line. The feature list is spelled out in full so a
      # future change to Cargo.toml defaults cannot silently weaken the gate.
      #
      # `management` / `deprecated-noop-tls` are the post-2026-07-30 names for
      # `experimental-jmx` / `experimental-tls`.
      #
      # PRE-EXISTING BREAKAGE: `experimental-crypto` has never been a declared
      # feature, so this step cannot resolve as written, and `bench/HelloWorld.class`
      # below is not a tracked fixture. Both predate this workflow's move into
      # `.github/workflows/` — fix the stale feature name and add the missing
      # fixture before trusting a green run of this job.
      - name: Test under no-default-natives feature set
        run: |
          cargo test -p cratonvm-vm \
            --no-default-features \
            --features "deprecated-noop-tls,experimental-crypto,management,experimental-serialization,experimental-aot,experimental-debug" \
            --all-targets

      # T2.1.2: run the HelloWorld smoke test with the audit flag + JSON
      # dump so the census artifact is populated. We use the hello-world
      # bench class that already exists at bench/HelloWorld.class.
      - name: Generate missing-natives census
        run: |
          cargo build -p cratonvm-cli --release
          ./target/release/cratonvm \
            --dump-missing-natives bench/missing-natives.json \
            --dump-missing-natives-grouped bench/missing-natives-grouped.json \
            -cp bench HelloWorld || true
          # The VM may exit non-zero on a missing native — that's expected
          # during census collection, so we tolerate it with `|| true`.

      - name: Diff census against committed baseline
        run: |
          if [ -f bench/missing-natives.json.baseline ]; then
            diff -u bench/missing-natives.json.baseline bench/missing-natives.json || {
              echo "::warning ::missing-natives.json drifted from committed baseline"
            }
          fi

      - name: Upload census artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-census
          path: |
            bench/missing-natives.json
            bench/missing-natives-grouped.json
          if-no-files-found: warn
