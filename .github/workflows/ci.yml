name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace

      # CONTRIBUTING.md / README claim CI enforces a "no debug/trace prints"
      # gate. Honour that claim: forbid reintroduction of bring-up
      # eprintln!/println! markers ([WP*], [DIAG*], [TRACE*], …) in landed code.
      # Bash-only script, so gate to the Linux leg.
      - name: Forbid debug-trace prints
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/check-no-diag-prints.sh

      - name: Clippy
        # CONTRIBUTING.md / README claim CI enforces `-D warnings`. Honour
        # that claim. `[workspace.lints]` in Cargo.toml already silences the
        # noise lints (dead_code, unused_*, rustdoc broken_intra_doc_links,
        # clippy empty_loop / while_let_loop) so this gate measures real
        # clippy findings, not boilerplate.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Synthetic-stub census guard: the `synthetic-stub` native bucket should
      # only ever SHRINK as the audit sweep classifies/deletes stubs. The VM's
      # `--dump-native-registry` flag emits a JSON census whose `counts` block
      # carries a `"synthetic-stub": N` total; this step boots the VM, dumps the
      # census, and reports that count.
      #
      # `cargo build --workspace` above already produced the cratonvm binary, so
      # this step reuses it (no rebuild). Generating a fresh census needs a JDK
      # runtime image (the command boots the VM and runs HelloWorld), which the
      # existing CI does NOT provision. Until a JDK is wired into CI this step is
      # ADVISORY: it is gated to Linux (one matrix leg, no duplication) and
      # marked `continue-on-error` so a missing JDK / boot failure does not
      # red-flag the build. Once a JDK is added here the gate becomes blocking
      # by dropping `continue-on-error`. See docs/synthetic-vs-real-explained.md.
      - name: synthetic-stub census guard
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        shell: bash
        run: |
          CENSUS="$(mktemp)"
          cargo run --quiet -p cratonvm-cli --bin cratonvm -- \
            --dump-native-registry "$CENSUS" \
            -cp vm-cli/tests/resources HelloWorld
          STUBS="$(grep -oE '"synthetic-stub": *[0-9]+' "$CENSUS" | grep -oE '[0-9]+')"
          echo "synthetic-stub natives in the default build: ${STUBS:-unknown}"
          if [ "${STUBS:-0}" -ne 0 ]; then
            echo "::warning::default build registered ${STUBS} synthetic-stub native(s)"
          fi

  # Smoke-test every per-subsystem CRATONVM_REAL_* real-path gate.
  # Requires a JDK (for javac to compile the Java test classes in build.rs)
  # and the cratonvm binary. The tests skip gracefully when prerequisites are
  # absent, so this job is non-blocking if the JDK setup fails.
  real-path-coverage:
    name: Real-path smoke tests (per-subsystem REAL_* gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set up JDK 21 (needed for build.rs javac and as cratonvm boot JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build (debug — produces cratonvm binary for subprocess tests)
        run: cargo build --workspace

      - name: Run real-path smoke tests
        run: >
          cargo test -p cratonvm-vm --test synthetic_diff
          real_annotations_path
          real_aqs_path
          real_raf_path
          real_fjp_path
          real_net_sockets_path
          -- --nocapture

  # Future CI hardening — not yet enabled. Uncomment once the
  # corresponding gates are ready to be enforced.
