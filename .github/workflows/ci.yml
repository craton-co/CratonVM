name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        # CONTRIBUTING.md / README claim CI enforces `-D warnings`. Honour
        # that claim. `[workspace.lints]` in Cargo.toml already silences the
        # noise lints (dead_code, unused_*, rustdoc broken_intra_doc_links,
        # clippy empty_loop / while_let_loop) so this gate measures real
        # clippy findings, not boilerplate.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

