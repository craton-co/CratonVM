name: HotSpot C2 Baseline Capture (T10.8.2)

# T17.E.1 — refresh `bench/hotspot-baseline.json` with HotSpot C2 medians
# captured on a known-clean runner. Without fresh numbers the
# `bench-hotspot-compare` CLI stays in bootstrap mode and the
# T10.8.2 geomean ≤ 1.5× gate cannot fire.
#
# Trigger: `workflow_dispatch` (Actions tab) OR a repo-owner typing
# `/capture-hotspot` as a PR comment (see the `issue_comment` job
# below, which filters on repo-owner + comment body).
#
# The workflow runs `scripts/capture-hotspot-baseline.sh` to produce
# the exact JSON schema consumed by `vm/src/bin/bench_hotspot_compare.rs`,
# then opens a PR updating `bench/hotspot-baseline.json`.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Timed iterations per kernel (default 10)'
        required: false
        default: '10'
      warmup:
        description: 'Warmup iterations per kernel (default 3)'
        required: false
        default: '3'
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  gate-comment:
    # Only run the capture when triggered by `/capture-hotspot` comment on a
    # PR authored/commented by the repo owner or a collaborator.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/capture-hotspot') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Verify java version
        run: |
          java -version
          # Fail early if the runner shipped a pre-25 JDK.
          MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d. -f1)
          if [ "$MAJOR" -lt 25 ]; then
            echo "HotSpot baseline requires JDK 25+, got $MAJOR" >&2
            exit 1
          fi

      - name: Capture HotSpot C2 medians
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '10' }}
          WARMUP: ${{ github.event.inputs.warmup || '3' }}
        run: |
          chmod +x scripts/capture-hotspot-baseline.sh
          bash scripts/capture-hotspot-baseline.sh \
            --out bench/hotspot-baseline.json \
            --iterations "$ITERATIONS" \
            --warmup "$WARMUP" \
            --host ubuntu-latest

      - name: Show captured JSON
        run: cat bench/hotspot-baseline.json

      - name: Install Rust (for schema validation)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Validate captured JSON against bench-hotspot-compare schema
        # Regression guard — if the capture script produces a malformed
        # file, bench-hotspot-compare will reject it with exit 2.
        # We feed the live baseline against itself (ratio=1) to force a
        # schema walk before we commit.
        run: |
          cargo run --release --bin bench-hotspot-compare -- \
            --rust-baseline bench/hotspot-baseline.json \
            --hotspot-baseline bench/hotspot-baseline.json \
            --threshold 2.0

      - name: Create PR with refreshed baseline
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Capture HotSpot C2 baseline'
          title: 'Refresh HotSpot C2 baseline (T10.8.2)'
          body: |
            Auto-generated by `.github/workflows/hotspot-baseline.yml`.

            Captured with `scripts/capture-hotspot-baseline.sh` on
            `ubuntu-latest` + Temurin JDK 25 / HotSpot C2
            (`-XX:TieredStopAtLevel=4`; `-XX:+UseC2Compiler` was removed
            in JDK 25 because C2 is unconditionally enabled on the
            server VM).

            This unblocks the T10.8.2 geomean gate: once merged,
            `bench-hotspot-compare` compares CratonVM's
            `bench/baseline.json` against live C2 medians instead of
            the all-zero placeholder.
          branch: hotspot-baseline-refresh
          delete-branch: true
          add-paths: bench/hotspot-baseline.json
