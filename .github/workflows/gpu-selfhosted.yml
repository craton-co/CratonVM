# Weekly real-hardware gate for GPU offload.
#
# Every real-GPU test in this tree is `#[ignore]`d or `gpu-it`-gated (see
# docs/gpu/README.md); `cuda-bridge.yml` only compiles the `cuda` feature on
# public `ubuntu-latest` runners — it never links a device, never launches a
# kernel. That gap let a real regression land undetected on 2026-07-11 (an
# invoke-cache promotion bug made GPU offload silently stop dispatching to
# the GPU after the first call at a call site — see
# gpu-offload-followups-20260711.md item 7). This workflow
# is the fix: build the real `gpu-driver` binary and run it against actual
# CUDA hardware, checksum- and timing-gated, on a schedule so a regression
# can't sit unnoticed between releases.
#
# Requires a self-hosted runner labeled `gpu` (see docs/gpu/ci.md for how to
# enroll one). Not run on PRs/pushes — self-hosted GPU capacity is scarce
# and a bad PR branch could otherwise tie up the only GPU box; weekly +
# on-demand is deliberate, not a placeholder.

name: gpu-selfhosted

on:
  schedule:
    # Every Monday 06:00 UTC. Cheap to shift; the point is "at least weekly."
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Real JDK home on the self-hosted GPU box. Matches the default every
  # bench-gpu/*.sh script and build-gpu-driver.bat already assumes for this
  # machine; override at the repo/environment level (Settings > Actions >
  # Variables) if the runner's JDK ever moves. Not auto-detected via
  # actions/setup-java: this job runs against the one real, already-driver-
  # capable JDK install on the GPU box, not a fresh per-run toolchain.
  JDK: ${{ vars.GPU_CI_JDK_HOME || 'C:/Program Files/Java/jdk-25' }}

jobs:
  gpu-gate:
    name: GPU offload real-hardware gate
    # Forks don't have (and shouldn't get) access to the self-hosted GPU
    # runner pool — without this guard, a fork's scheduled/dispatch run
    # would just queue forever with no runner to pick it up.
    if: github.repository == 'craton-co/cratonvm'
    runs-on: [self-hosted, gpu]

    steps:
      - uses: actions/checkout@v4

      # Mirrors build-gpu-driver.bat: real cudarc bindings, isolated target
      # dir so this never collides with a CPU-only build on the same box.
      - name: Build cratonvm (gpu-driver)
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-gpu
        run: cargo build --release -p cratonvm-cli --bin cratonvm --features gpu-driver

      # Compile only the fixtures ci-gate.sh actually drives: bench-gpu/ for
      # the warm-timing / checksum / --gpu-info gates, test_classes/gpu/ for
      # the bounds-deopt integrity gate (BoundsDeopt2 + the EligibleVectorAdd
      # helper it calls) and the forward-reference gate (GpuForwardRef).
      - name: Compile bench-gpu fixtures
        shell: bash
        run: |
          "$JDK/bin/javac" -d bench-gpu bench-gpu/GpuWarm.java bench-gpu/GpuCompute.java bench-gpu/GpuProbe.java
          "$JDK/bin/javac" -d test_classes/gpu test_classes/gpu/EligibleVectorAdd.java test_classes/gpu/BoundsDeopt2.java test_classes/gpu/GpuForwardRef.java

      - name: Run GPU offload gate
        shell: bash
        env:
          CV_GPU: ${{ github.workspace }}/target-gpu/release/cratonvm.exe
          ROOT: ${{ github.workspace }}
          GO: ${{ github.workspace }}/bench-gpu
          TG: ${{ github.workspace }}/test_classes/gpu
        run: bash bench-gpu/ci-gate.sh | tee gpu-gate.log

      # The cross-stream ordering contract, against the driver rather
      # than against the stub.
      #
      # Every behavioural test of streams, events and launches in
      # `cuda-bridge` is `#[cfg(all(test, not(feature = "cuda")))]` —
      # enabling the `cuda` feature takes the crate from 39 unit tests to
      # 16 and from 6 integration tests to 1, because the rest inspect an
      # operation log the real backend does not keep. A model is worth
      # testing against and a model is not the thing: a missing
      # `cuStreamWaitEvent` is invisible to an op-log assertion and is a
      # race on hardware. These three are `#[ignore]`d so a machine
      # without a device skips them, which means this job is the only
      # place they ever run.
      # The VM-side offload runtime, in the shapes ci-gate.sh does not
      # reach: concurrent dispatch from several Java threads, residency
      # cache coherence across host writes (plain astore AND
      # System.arraycopy), read-only input suppression, aliased
      # arguments, and a bounds deopt followed by more submits.
      #
      # This is the regression test for the 2026-09-02 invalidation
      # holes: the interpreter's FAST xastore arm and the native bulk
      # array copy both wrote arrays without evicting the GPU
      # input-residency cache, so the next submit computed from stale
      # device data. Four of these seven scenarios failed before the fix.
      - name: VM offload runtime stress (real driver)
        shell: bash
        env:
          CV: ${{ github.workspace }}/target-gpu/release/cratonvm.exe
          JDK: ${{ env.JDK }}
          TG: ${{ github.workspace }}/test_classes/gpu
        run: bash bench-gpu/runtime-stress.sh | tee runtime-stress.log

      # Marshalling: all SIX element types the pipeline admits, across
      # both transfer paths (zero-copy and, with
      # CRATONVM_GPU_NO_ZEROCOPY=1, staged), at odd lengths, with inputs
      # spanning each type's full range -- every one of the 65536 short
      # values and all 256 byte values, and every float/double edge case
      # including NaN and both zeros.
      #
      # This is the regression test for the 2026-09-02 short[]/byte[]
      # gap: the analyzer admitted those kernels and the lowering emitted
      # PTX, but `dispatch_method_from_native`'s `match element_type` had
      # no arm for them, so each dispatch failed at marshalling and
      # silently re-ran on the interpreter. The answers stayed correct,
      # which is why it survived -- so this script also counts H2D
      # transfers per kernel and FAILS if any of the six never dispatched.
      # A correctness arm with no engagement census cannot see this class
      # of defect; it ends up comparing the interpreter with itself.
      - name: GPU marshalling stress (real driver)
        shell: bash
        env:
          CV: ${{ github.workspace }}/target-gpu/release/cratonvm.exe
          JDK: ${{ env.JDK }}
          TG: ${{ github.workspace }}/test_classes/gpu
        run: bash bench-gpu/marshal-stress.sh | tee marshal-stress.log

      # The residency cache is keyed by a raw heap address, so every
      # relocation has to re-key its entries. short[]/byte[] entries only
      # started appearing in that cache on 2026-09-02, and the remap had
      # never carried one.
      #
      # Run once per collector: ZGC, G1 and Generational relocate on
      # different schedules and through different code.
      #
      # The script asserts that a cached array was actually MOVED
      # (`re-keyed` > 0), not merely that the values matched. Without
      # that assertion it passes vacuously and did: with the obvious
      # settings it drove zero collections, and with a small heap alone
      # it drove 25 collections that never moved a cached array. The
      # -Xmx and --gpu-min-work defaults inside the script are what make
      # a cached array small enough and young enough to be relocated.
      - name: GPU residency across a moving collector (real driver)
        shell: bash
        env:
          CV: ${{ github.workspace }}/target-gpu/release/cratonvm.exe
          JDK: ${{ env.JDK }}
          TG: ${{ github.workspace }}/test_classes/gpu
        run: bash bench-gpu/residency-gc.sh | tee residency-gc.log

      # A JIT-compiled array writer must not leave the residency cache
      # stale. `offload_jit_gate` keeps such methods out of the JIT, by
      # scanning for the store opcodes whose arrays the cache can hold --
      # a list that has to be extended every time a new element type
      # becomes marshallable, and was not when short[]/byte[] were added.
      #
      # The fixture's int[] arm is the control: its writer IS refused, so
      # a run where short and byte are wrong while int is right names the
      # opcode set as the cause. The defaults (n=8192, 2000 rounds) are
      # what make the writers hot enough to be compiled -- at n=131072
      # over 400 rounds the defect does not reproduce at all.
      - name: GPU stale-read from a compiled array writer (real driver)
        shell: bash
        env:
          CV: ${{ github.workspace }}/target-gpu/release/cratonvm.exe
          JDK: ${{ env.JDK }}
          TG: ${{ github.workspace }}/test_classes/gpu
        run: bash bench-gpu/jit-writer-stale.sh | tee jit-writer-stale.log

      # Concurrent dispatch: one context, many threads — the shape
      # `OffloadCacheRegistry` gives every dispatching Java thread. This
      # is the regression test for the 2026-09-02 `DeviceBuffer::zeros`
      # defect, where an unordered zeroing memset overwrote a kernel's
      # output. It only reproduces at 4 MiB buffers, so it is sized for
      # that and must not be shrunk to make it quicker.
      - name: cuda-bridge concurrent dispatch (real driver)
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-gpu
        run: |
          cargo test --release -p cratonvm-cuda-bridge --features cuda               --test concurrent_dispatch_it -- --ignored --nocapture

      - name: cuda-bridge cross-stream ordering (real driver)
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-gpu
        run: |
          cargo test --release -p cratonvm-cuda-bridge --features cuda               --test stream_ordering_it -- --ignored --nocapture

      # Not a gate: bandwidth and module-load numbers move with the
      # driver and the box, and a threshold on them would fail whenever
      # something else was running. Recorded so the two decisions they
      # settled — no pinned staging on the upload path, no cubin cache —
      # can be revisited against fresh numbers rather than these.
      - name: cuda-bridge transfer + module-load report
        shell: bash
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-gpu
        run: |
          cargo test --release -p cratonvm-cuda-bridge --features cuda               --test transfer_bandwidth_it -- --ignored --nocapture               | tee transfer-report.log

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-gate-log
          path: gpu-gate.log
          if-no-files-found: error
