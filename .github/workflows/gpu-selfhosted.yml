# Weekly real-hardware gate for GPU offload.
#
# Every real-GPU test in this tree is `#[ignore]`d or `gpu-it`-gated (see
# docs/gpu/README.md); `cuda-bridge.yml` only compiles the `cuda` feature on
# public `ubuntu-latest` runners — it never links a device, never launches a
# kernel. That gap let a real regression land undetected on 2026-07-11 (an
# invoke-cache promotion bug made GPU offload silently stop dispatching to
# the GPU after the first call at a call site — see
# docs/known-issues/gpu-offload-followups-20260711.md item 7). This workflow
# is the fix: build the real `gpu-driver` binary and run it against actual
# CUDA hardware, checksum- and timing-gated, on a schedule so a regression
# can't sit unnoticed between releases.
#
# Requires a self-hosted runner labeled `gpu` (see docs/gpu/ci.md for how to
# enroll one). Not run on PRs/pushes — self-hosted GPU capacity is scarce
# and a bad PR branch could otherwise tie up the only GPU box; weekly +
# on-demand is deliberate, not a placeholder.

name: gpu-selfhosted

on:
  schedule:
    # Every Monday 06:00 UTC. Cheap to shift; the point is "at least weekly."
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Real JDK home on the self-hosted GPU box. Matches the default every
  # bench-gpu/*.sh script and build-gpu-driver.bat already assumes for this
  # machine; override at the repo/environment level (Settings > Actions >
  # Variables) if the runner's JDK ever moves. Not auto-detected via
  # actions/setup-java: this job runs against the one real, already-driver-
  # capable JDK install on the GPU box, not a fresh per-run toolchain.
  JDK: ${{ vars.GPU_CI_JDK_HOME || 'C:/Program Files/Java/jdk-25' }}

jobs:
  gpu-gate:
    name: GPU offload real-hardware gate
    # Forks don't have (and shouldn't get) access to the self-hosted GPU
    # runner pool — without this guard, a fork's scheduled/dispatch run
    # would just queue forever with no runner to pick it up.
    if: github.repository == 'craton-co/cratonvm'
    runs-on: [self-hosted, gpu]

    steps:
      - uses: actions/checkout@v4

      # Mirrors build-gpu-driver.bat: real cudarc bindings, isolated target
      # dir so this never collides with a CPU-only build on the same box.
      - name: Build cratonvm (gpu-driver)
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-gpu
        run: cargo build --release -p cratonvm-cli --bin cratonvm --features gpu-driver

      # Compile only the fixtures ci-gate.sh actually drives: bench-gpu/ for
      # the warm-timing / checksum / --gpu-info gates, test_classes/gpu/ for
      # the bounds-deopt integrity gate (BoundsDeopt2 + the EligibleVectorAdd
      # helper it calls).
      - name: Compile bench-gpu fixtures
        shell: bash
        run: |
          "$JDK/bin/javac" -d bench-gpu bench-gpu/GpuWarm.java bench-gpu/GpuCompute.java bench-gpu/GpuProbe.java
          "$JDK/bin/javac" -d test_classes/gpu test_classes/gpu/EligibleVectorAdd.java test_classes/gpu/BoundsDeopt2.java

      - name: Run GPU offload gate
        shell: bash
        env:
          CV_GPU: ${{ github.workspace }}/target-gpu/release/cratonvm.exe
          ROOT: ${{ github.workspace }}
          GO: ${{ github.workspace }}/bench-gpu
          TG: ${{ github.workspace }}/test_classes/gpu
        run: bash bench-gpu/ci-gate.sh | tee gpu-gate.log

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-gate-log
          path: gpu-gate.log
          if-no-files-found: error
