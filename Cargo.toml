[workspace]
members = ["reader", "types", "native-api", "native-collections", "native-io", "native-builtins", "native-awt", "jit-api", "jit", "jit-cuda", "cuda-bridge", "classloading", "gc", "vm", "vm-cli", "jfr"]
resolver = "2"

[workspace.package]
publish = false
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/craton-co/rust-jvm"
homepage = "https://github.com/craton-co/rust-jvm"
description = "A Java Virtual Machine written entirely in Rust with a custom x86-64 JIT compiler"
keywords = ["jvm", "java", "virtual-machine", "interpreter", "jit"]
categories = ["compilers", "emulators"]

[workspace.dependencies]
thiserror = "2"
# Round-8 cross-cutting Bug 3: workspace-wide pin for `zip` so every crate
# that opts in via `zip.workspace = true` resolves to the same major
# version. `native-io` already targets 2.x; `native-builtins` is still on
# 0.6 because `FileOptions::default()` and the un-generic `ZipWriter` API
# disappeared in 2.x (every `start_file` / `ZipWriter::new` call site needs
# the `SimpleFileOptions` migration). Until that migration lands the two
# crates still pull two distinct `zip` impls — tracked as a follow-up.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Round-7 cross-cutting Fix 3: `release_max_level_info` causes `trace!` and
# `debug!` macros to expand to no-ops in release builds. The VM has thousands
# of trace/debug sites in interpreter dispatch, GC scan loops, JIT entry, and
# class-loading paths; even with subscriber filtering, the per-call
# argument formatting / level check is non-zero. Compile-time elision wins it
# back. Set on the workspace dep so every crate that uses
# `tracing.workspace = true` inherits the cap.
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# RJ.4 — silence lints that do not represent real defects so
# `cargo doc --workspace --no-deps` stays at zero warnings (the
# roadmap success criterion). Code-lints are "allow" not "deny":
# individual crates can still re-tighten them locally.
#   * `dead_code`, `unused_*`: natives register at runtime via
#     `NativeMethodRegistry::register`; the compiler sees them as
#     orphaned. Marking with `#[used]` everywhere would be noisier
#     than tolerating the lint.
#   * rustdoc `broken_intra_doc_links` / `invalid_html_tags` /
#     `private_intra_doc_links` / `redundant_explicit_links`:
#     doc-comments liberally reference private helpers, Java types
#     (`<offset>`, `[Xn,]`) and code samples; the net value of
#     enforcing rustdoc hyperlinks over those is negative.
[workspace.lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused_mut = "allow"
unused_assignments = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
invalid_html_tags = "allow"
redundant_explicit_links = "allow"

[workspace.lints.clippy]
# Clippy "never returns" false positive on functions that panic — our
# `unimplemented!()`/`panic!()` paths trip this on every native stub.
empty_loop = "allow"
# Forever-looping server accept loops also trip this.
while_let_loop = "allow"

# Compile ZIP decompression with optimisations even in debug mode.
# Without this, deflate is ~15x slower and JMOD loading takes 30s+ for 200 classes.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

# Round-7 cross-cutting Fix 1: cargo defaults (lto=false, codegen-units=16)
# defeat most cross-crate inlining. The VM has hundreds of `#[inline(always)]`
# annotations on small hot-path helpers (interpreter dispatch, TLAB bump,
# header reads) that only inline across crate boundaries under LTO.
#
# - `panic = "unwind"` MUST stay: the VM has 37 `std::panic::catch_unwind`
#   sites that depend on stack unwinding to recover from JIT/interpreter
#   faults; `panic = "abort"` would break exception safety.
# - `codegen-units = 1` trades parallel codegen (slower link) for the
#   single-unit optimization picture LTO + inliner need.
# - `incremental = false` disables incremental release builds — they
#   defeat LTO and are not safe to ship.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
incremental = false
debug = false

# Same as release but keep line-tables-only debuginfo, useful for
# perf/profilers (perf record, samply, vtune) without paying the size
# cost of full debug info.
[profile.release-with-debug]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# Benches must use the same codegen as release so criterion numbers are
# representative of what users will actually run.
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
incremental = false
debug = false
