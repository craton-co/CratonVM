# Compile ZIP decompression with optimisations even in debug mode.
# Without this, deflate is ~15x slower and JMOD loading takes 30s+ for 200 classes.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

# Round-10 cross-cutting: with the round-9 benchmark additions (~163 LOC) +
# steady native-builtins growth, MSVC link.exe hits LNK1140 ("too many
# modules for program database") for the cli binaries when dev profile uses
# `debug = 2` (full debug info, the cargo default). Drop to line-tables-only
# — keeps file:line in backtraces but excludes per-symbol DWARF/CodeView
# records that overflow the PDB module table on Windows. Linux/macOS pay no
# cost; Windows builds again. Override locally with `cargo build --profile dev-full`.
[profile.dev]
debug = "line-tables-only"

[profile.dev-full]
inherits = "dev"
debug = 2

# Round-7 cross-cutting Fix 1: cargo defaults (lto=false, codegen-units=16)
# defeat most cross-crate inlining. The VM has hundreds of `#[inline(always)]`
# annotations on small hot-path helpers (interpreter dispatch, TLAB bump,
# header reads) that only inline across crate boundaries under LTO.
#
# - `panic = "unwind"` MUST stay: the VM has 37 `std::panic::catch_unwind`
#   sites that depend on stack unwinding to recover from JIT/interpreter
#   faults; `panic = "abort"` would break exception safety.
# - `codegen-units = 1` trades parallel codegen (slower link) for the
#   single-unit optimization picture LTO + inliner need.
# - `incremental = false` disables incremental release builds — they
#   defeat LTO and are not safe to ship.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
# Perf-session note (perf/throughput-20260710): line-tables-only + no strip so
# the PDB carries function symbols for sampling profilers (cdb attach). No
# codegen impact — only fatter debug artifacts on disk.
strip = "none"
incremental = false
debug = "line-tables-only"

# NOTE: there is deliberately no `release-with-debug` profile. `release` above
# already sets `debug = "line-tables-only"` and `strip = "none"`, so such a
# profile inheriting `release` and re-stating those two keys was byte-identical
# to `release` while costing a second full `target/` tree to build. Use
# `--release` for line tables, `--profile profsym` for symbol-resolving
# profilers, `--profile livedbg` for a debugger.

# Full debuginfo (S_GPROC32 function records in the PDB) so a sampling
# profiler (samply/ETW) can resolve Rust function names, not just line
# tables. Profiling captures only — never shipped. Same codegen as release
# (opt-level 3, fat LTO) so the profile is representative.
[profile.profsym]
inherits = "release"
debug = 2
strip = "none"

# Live-debugger profile: full debuginfo AND no LTO / low opt-level so local
# variables survive for conditional breakpoints. The default release profile
# defeats both, via `debug = "line-tables-only"` and fat LTO, even where it
# does not change program behaviour. Opt-in only (`--profile livedbg`), so it
# carries no risk to the shipped build.
#
# Interpreter/JIT crates build at opt-level 1 — still far faster than a plain
# debug build — while `native-builtins` and `native-io` drop to opt-level 0,
# because that is where the socket/protocol code whose locals are most often
# needed lives. Runtime is meaningfully slower than release but still boots a
# large application server in reasonable time, which makes it right for
# boot-time bugs and wrong for throughput work; use `profsym` for the latter.
[profile.livedbg]
inherits = "release"
debug = 2
strip = "none"
lto = false
codegen-units = 16
opt-level = 1
incremental = false

[profile.livedbg.package.cratonvm-native-builtins]
opt-level = 0

[profile.livedbg.package.cratonvm-native-io]
opt-level = 0


# Benches must use the same codegen as release so criterion numbers are
# representative of what users will actually run.
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
incremental = false
debug = false

# T-CBC.1: vendored, minimally-patched rustls 0.23.38 (native-builtins/vendor/rustls-cbc)
# adding mac_key_len support to the TLS1.2 key schedule so classic CBC+HMAC
# cipher suites (which need a separate MAC secret rustls's stock
# Tls12AeadAlgorithm/KeyBlockShape has no field for) can derive standard
# RFC 5246 A.6-ordered key material. See docs/known-issues/springboot/
# rustls-cbc-cipher-suites-not-supported.md for the full rationale.
[patch.crates-io]
rustls = { path = "native-builtins/vendor/rustls-cbc" }
