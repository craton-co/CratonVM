[package]
name = "cratonvm-native-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Native method API for CratonVM — NativeContext trait and registry"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# When enabled, exposes `test_mock::MockNativeContext` to downstream crates so
# they can drive `NativeContext` trait default impls without standing up a
# full VM. Auto-enabled inside this crate under `#[cfg(test)]`.
test-mock = []

[dependencies]
cratonvm-types = { path = "../types", version = "0.3.0" }
parking_lot.workspace = true
socket2 = { version = "0.5", features = ["all"] }
native-tls = "0.2"
rustc-hash.workspace = true

[lints]
workspace = true
