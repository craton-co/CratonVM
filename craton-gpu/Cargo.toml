[package]
name = "craton-gpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Java annotation sources for CratonVM GPU/parallel-compute support, compiled at build time"
build = "build.rs"
# Virtual `links` name. No actual native library is linked; this purely
# enables cargo's `DEP_<NAME>_<KEY>` mechanism so that build scripts of
# crates that depend on `craton-gpu` can read the metadata this crate's
# build.rs emits via `cargo:annotations_dir=` / `cargo:annotations_jar=`.
links = "craton-gpu-annotations"

[lib]
path = "src/lib.rs"
