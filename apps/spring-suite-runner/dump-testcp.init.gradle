// Registers a `dumpTestCp` task on every java project that writes the EXACT
// test runtime classpath (test output + main output + all deps) the Gradle
// Test task would use, to build/cratonvm-testcp.txt. Consumed by the CratonVM
// Spring suite harness (apps/spring-suite-runner/run-suite.sh) so each test
// class can be launched standalone under cratonvm.
//
// Restored from git history commit 278b34e69 (spring-suite/dump-testcp.init.gradle,
// the predecessor harness) -- run-suite.sh's comments reference this file by name
// but it was never carried into apps/spring-suite-runner/.
//
// ---------------------------------------------------------------------------
// WHY THIS TASK MUST `dependsOn` THE CLASSPATH IT DUMPS
// ---------------------------------------------------------------------------
// `sourceSets.test.runtimeClasspath` is a lazily-resolved FileCollection. For a
// cross-project (`project(":spring-oxm")`) or test-fixtures dependency, Gradle
// resolves it to that project's PUBLISHED ARTIFACT -- `build/libs/<name>-<ver>.jar`
// -- not to its `build/classes/java/main` directory. Calling `.asPath` only asks
// for the *names* of those files; it does not ask Gradle to PRODUCE them.
//
// Without the `dependsOn` below, `./gradlew testClasses dumpTestCp` therefore
// wrote a perfectly well-formed classpath naming ~24 jars that the build had
// never been asked to create, and the harness then launched every test class
// against a classpath full of non-existent entries. The JVM silently skips a
// missing classpath element, so this surfaced only as a flood of
// `NoClassDefFoundError` at run time -- 789 of 1156 failure-cause lines (68%) in
// the 2026-08-10 full-suite GC-variant sweep, spanning every package that lives
// in a module whose jar was missing:
//
//     spring-core-test  -> org/springframework/aot/test/**, org/springframework/core/test/**
//     spring-context-support -> org/springframework/cache/**, mail/**, scheduling/**, ui/freemarker/**
//     spring-jms, spring-orm, spring-oxm, spring-websocket, spring-instrument,
//     spring-aspects, spring-context-indexer -> their own packages
//
// Declaring the classpath as a task dependency makes `dumpTestCp` build every
// artifact it is about to name, so the file it writes is true when it is written.
// Verify with: run-suite.sh's `check-cp` command (fails loudly on any missing entry).
gradle.allprojects { p ->
    p.plugins.withId('java') {
        p.tasks.register('dumpTestCp') {
            // Build every jar / test-fixtures jar / class dir the dumped path names.
            // A FileCollection carries its own task dependencies, so this single
            // line pulls in `jar`, `testFixturesJar`, `testClasses`, ... for this
            // project AND every project it depends on.
            dependsOn p.sourceSets.test.runtimeClasspath
            doLast {
                try {
                    def rc = p.sourceSets.test.runtimeClasspath.asPath
                    def missing = rc.split(File.pathSeparator).findAll { it && !new File(it).exists() }
                    def f = new File(p.layout.buildDirectory.get().asFile, 'cratonvm-testcp.txt')
                    f.parentFile.mkdirs()
                    f.text = rc
                    if (missing.isEmpty()) {
                        println "CPDUMP ${p.path} OK chars=${rc.length()} entries=${rc.split(File.pathSeparator).length}"
                    } else {
                        // Never silent: a dumped-but-absent entry is exactly the
                        // failure mode this task's dependsOn exists to prevent.
                        println "CPDUMP ${p.path} INCOMPLETE chars=${rc.length()} missing=${missing.size()}"
                        missing.each { println "CPDUMP-MISSING ${p.path} ${it}" }
                    }
                } catch (Throwable t) {
                    println "CPDUMP ${p.path} FAIL ${t.message}"
                }
            }
        }
    }
}
