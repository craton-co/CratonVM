[package]
name = "cratonvm-jit-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "JIT compiler API types for CratonVM"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cratonvm-types = { path = "../types", version = "0.3.0" }
cratonvm-reader = { path = "../reader", version = "0.3.0" }

[features]
default = []
# Expose the GpuLowering trait. The trait is referenced only by the
# (optional) GPU-offload path in the VM; the CPU JIT does not link
# it. Off by default to keep the CPU path's public surface unchanged.
gpu-lowering = []

[lints]
workspace = true
