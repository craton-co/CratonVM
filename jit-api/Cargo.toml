[package]
name = "rustjvm-jit-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JIT compiler API types for RustJVM"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rustjvm-types = { path = "../types" }
rustjvm-reader = { path = "../reader" }

[features]
default = []
# Expose the GpuLowering trait. The trait is referenced only by the
# (optional) GPU-offload path in the VM; the CPU JIT does not link
# it. Off by default to keep the CPU path's public surface unchanged.
gpu-lowering = []

[lints]
workspace = true
