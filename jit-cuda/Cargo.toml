[package]
name = "jit-cuda"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Java bytecode → PTX lowering for CratonVM GPU offload"
documentation = "https://docs.rs/jit-cuda"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cratonvm-reader = { path = "../reader" }
cratonvm-types = { path = "../types" }
cratonvm-jit-api = { path = "../jit-api" }
# `craton-gpu` is pulled in purely so cargo schedules its build script
# BEFORE ours and exposes the `DEP_CRATON_GPU_ANNOTATIONS_ANNOTATIONS_*`
# env vars (via its `links = "craton-gpu-annotations"` declaration) to
# our build.rs. The Rust code in this crate does not call into it.
craton-gpu = { path = "../craton-gpu" }
thiserror = { workspace = true }

[dev-dependencies]
# Real .class files live in test_classes/gpu/. Tests parse them
# through cratonvm-reader — no synthetic bytecode arrays.

[features]
default = []
# Tests requiring an attached GPU (assembled by `ptxas`).
gpu-it = []

[lints]
workspace = true

[build-dependencies]
# build.rs invokes `javac` directly via std::process::Command;
# no extra deps needed.
