# cbindgen configuration for the libcratonvm flat C API.
#
# This drives regeneration of `include/cratonvm.h` from the `#[repr(C)]` /
# `#[no_mangle] pub extern "C"` items in `src/lib.rs`. Regeneration is a
# build-step opt-in (see `build.rs`): set `CRATONVM_REGEN_HEADER=1` with the
# `cbindgen` CLI on PATH (`cargo install cbindgen`). By default the build does
# NOT run cbindgen — the checked-in header is maintained to stay byte-compatible
# with this config so a regeneration is a no-op diff.
#
# Only the flat `cratonvm_*` surface is exported; the JNI Invocation-API entry
# points (JNI_CreateJavaVM / JNI_GetDefaultJavaVMInitArgs / JNI_GetCreatedJavaVMs)
# are the standard <jni.h> surface and are excluded here.

language = "C"
header = """/* SPDX-License-Identifier: Apache-2.0
 * Copyright 2024-2026 Craton Software Company
 *
 * cratonvm.h — public C header for the libcratonvm flat embedding API
 * (Layer 2 of docs/feature-designs/embedding-api.md).
 *
 * GENERATED by cbindgen from libcratonvm/src/lib.rs — do not edit by hand when
 * regenerating (CRATONVM_REGEN_HEADER=1). The JNI Invocation-API entry points
 * are the standard <jni.h> surface and are intentionally not declared here.
 */"""
include_guard = "CRATONVM_H"
tab_width = 4
style = "type"
cpp_compat = true
sys_includes = ["stdint.h"]
no_includes = true

[export]
include = [
    "CratonValue",
    "JavaVMOption",
    "JavaVMInitArgs",
]
# Export only the flat C API; keep the JNI bootstrap entry points out.
exclude = [
    "JNI_CreateJavaVM",
    "JNI_GetDefaultJavaVMInitArgs",
    "JNI_GetCreatedJavaVMs",
    "JavaVM",
    "JNIEnv",
    "JInt",
    "JSize",
]
prefix = ""

[export.rename]
"JInt" = "cratonvm_jint"

[fn]
sort_by = "None"

[parse]
parse_deps = false
