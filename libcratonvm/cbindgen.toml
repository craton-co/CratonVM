# cbindgen configuration for the libcratonvm flat C API.
#
# This drives regeneration of `include/cratonvm.h` from the `#[repr(C)]` /
# `#[no_mangle] pub extern "C"` items in `src/lib.rs`. Regeneration is a
# build-step opt-in (see `build.rs`): set `CRATONVM_REGEN_HEADER=1` with the
# `cbindgen` CLI on PATH (`cargo install cbindgen`). By default the build does
# NOT run cbindgen. The checked-in header is maintained to stay ABI-compatible
# with this config; a regeneration may differ in comments or field spelling but
# must cover the same public flat API surface.
#
# Only the flat `cratonvm_*` surface is exported; the JNI Invocation-API entry
# points (JNI_CreateJavaVM / JNI_GetDefaultJavaVMInitArgs / JNI_GetCreatedJavaVMs)
# are the standard <jni.h> surface and are excluded here.

language = "C"
header = """/* SPDX-License-Identifier: Apache-2.0
 * Copyright 2024-2026 Craton Software Company
 *
 * cratonvm.h — public C header for the libcratonvm flat embedding API
 * (Layer 2 of docs/feature-designs/embedding-api.md).
 *
 * GENERATED by cbindgen from libcratonvm/src/lib.rs (CRATONVM_REGEN_HEADER=1).
 * Keep ABI coverage aligned with the checked-in public header. The JNI
 * Invocation-API entry points are the standard <jni.h> surface and are
 * intentionally not declared here.
 */"""
include_guard = "CRATONVM_H"
tab_width = 4
style = "type"
cpp_compat = true
sys_includes = ["stdint.h"]
no_includes = true

[export]
include = [
    "JInt",
    "JavaVMOption",
    "JavaVMInitArgs",
    "CratonVm",
    "CratonRef",
    "CratonClass",
    "CratonValue",
    "CRATONVM_JNI_OK",
    "CRATONVM_JNI_ERR",
    "CRATONVM_JNI_EDETACHED",
    "CRATONVM_JNI_EVERSION",
    "CRATONVM_JNI_ENOMEM",
    "CRATONVM_JNI_EEXIST",
    "CRATONVM_JNI_EINVAL",
    "CRATONVM_JNI_VERSION",
    "CRATON_TAG_VOID",
    "CRATON_TAG_INT",
    "CRATON_TAG_LONG",
    "CRATON_TAG_FLOAT",
    "CRATON_TAG_DOUBLE",
    "CRATON_TAG_OBJECT",
    "CRATON_TAG_ERROR",
    # Compatibility-mode ABI values: published, stable, append-only. Keep in
    # lockstep with the anonymous enum in include/cratonvm.h.
    "CRATONVM_COMPATIBILITY_COMPATIBLE",
    "CRATONVM_COMPATIBILITY_JDK_ONLY",
    "cratonvm_thread_enter_native",
    "cratonvm_thread_leave_native",
    "cratonvm_create",
    "cratonvm_create_with_compatibility",
    "cratonvm_destroy",
    "cratonvm_release_ref",
    "cratonvm_load_class",
    "cratonvm_invoke_static",
    "cratonvm_invoke_virtual",
    "cratonvm_new_string",
    "cratonvm_string_utf8",
    "cratonvm_free_string",
    "cratonvm_object_class",
    "cratonvm_class_name",
    "cratonvm_field_count",
    "cratonvm_get_field",
    "cratonvm_field_index",
    "cratonvm_field_index_desc",
    "cratonvm_get_field_by_name",
    "cratonvm_set_field",
    "cratonvm_set_field_by_name",
    "cratonvm_compatibility_mode",
    "cratonvm_compatibility_mode_supported",
    "cratonvm_last_error",
    "cratonvm_clear_error",
]
# Export only the flat C API; keep the JNI bootstrap entry points out.
exclude = [
    "JNI_CreateJavaVM",
    "JNI_GetDefaultJavaVMInitArgs",
    "JNI_GetCreatedJavaVMs",
    "JavaVM",
    "JNIEnv",
    "JSize",
]
prefix = ""

[export.rename]
"JInt" = "cratonvm_jint"

[fn]
sort_by = "None"

[parse]
parse_deps = false
