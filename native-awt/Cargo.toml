[package]
name = "rustjvm-native-awt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "AWT/Swing/Java2D native peer implementation for RustJVM"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []

[dependencies]
rustjvm-types = { path = "../types" }
rustjvm-native-api = { path = "../native-api" }
tracing = "0.1"
parking_lot = "0.12"
bitflags = "2"
rustc-hash = "1.1"

# Platform-specific windowing backends
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectWrite",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
fontdue = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSView", "NSEvent", "NSGraphicsContext", "NSImage", "NSPasteboard", "NSApplication", "NSFont", "NSColor", "NSTextField", "NSButton", "NSMenu"] }

[dev-dependencies]

[lints]
workspace = true
