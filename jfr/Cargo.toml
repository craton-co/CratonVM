[dependencies]
# AUDIT 2026-05-16: removed dead `parking_lot = "0.12"` dependency
# (declared but unused; crate is single-threaded, sync via plain Mutex
# where present).
rustc-hash = "1.1"
# J5 (round-2): SmallVec for inline EventInstance.fields storage. Most events
# carry <= 4 fields, so this avoids a heap allocation per event on the hot path.
smallvec = "1"

