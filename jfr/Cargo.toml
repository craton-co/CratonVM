[package]
name = "rustjvm-jfr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Java Flight Recorder support for RustJVM"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Round-4 (2026-05-17): re-introduced for the `ThreadRingRegistry::rings`
# RwLock — the previous std `Mutex` serialized every drain against every
# register, and the registry-side critical section is read-heavy (one
# register per thread-lifetime, many drains).
parking_lot.workspace = true
rustc-hash.workspace = true
# J5 (round-2): SmallVec for inline EventInstance.fields storage. Most events
# carry <= 4 fields, so this avoids a heap allocation per event on the hot path.
# TODO(round-4-wave-3): wire SmallVec into `EventInstance.fields`. The current
# `Vec<EventValue>` allocates per emit; changing the field type cascades into
# every constructor across the workspace (vm tests, recording, stream, etc.).
smallvec = "1"

[lints]
workspace = true
